name: PJM-011 browser QA (feature branch only)

on:
  push:
    branches:
      - feature/pjm-011-clinic-detail-flow
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - tests/test_pjm_011.py
      - .github/workflows/pjm-011-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Chromium 320 / 390 / 768 / 1440
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright==1.56.0"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_pjm_011.py
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjm-011-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
