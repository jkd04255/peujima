name: PJM-014 functional-first UI and full regression QA
on:
  push:
    branches:
      - feature/pjm-014-functional-cleanup
      - feature/pjm-015-remove-duplicate-headers
      - feature/pjm-016-map-marker-selection
      - feature/pjm-017-subtle-map-selection
      - feature/pjm-018-suit-typography
      - feature/pjm-018-typography-system
      - feature/pjm-019-policy-benefit-estimator
      - feature/pjm-020-simple-insurance-summary
      - feature/pjm-021-insurance-common-care
      - feature/pjm-022-db-dog-verified-guide
      - feature/pjm-023-expanded-insurance-catalog
      - feature/pjm-030-compact-footer-notes
      - feature/pjm-031-comprehensive-care-breakdown
      - feature/pjm-032-approximate-cost-ranges
      - feature/pjm-041-route-focus
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - pjm013-navigation.css
      - pjm013-navigation.js
      - pjm012-nearby.js
      - pjm012-nearby.css
      - pjm019-insurance.js
      - pjm023-catalog.js
      - pjm031-care-procedures.js
      - pjm032-cost-bands.js
      - pjm045-settlement.js
      - pjm019-insurance.css
      - tests/test_pjm_016_marker_selection.py
      - tests/test_pjm_012_mobile.py
      - tests/test_pjm_012.py
      - tests/test_pjm_012_live.py
      - scripts/build_pages.py
      - scripts/ios_safari_lan.py
      - tests/test_pjm_013_navigation.py
      - tests/test_pjm_013_accessibility.py
      - tests/test_pjm_011.py
      - tests/test_pjm_012.py
      - tests/test_pjm_012_mobile.py
      - tests/test_pjm_012_accessibility.py
      - tests/test_pjm_012_live.py
      - .github/workflows/pjm-014-qa.yml
      - tests/test_pjm_014_compact_ui.py
      - tests/test_pjm_018_typography.py
      - tests/test_pjm_019_insurance.py
      - tests/test_pjm_021_guides.py
      - tests/test_pjm_022_db_guides.py
      - tests/test_pjm_023_catalog.py
      - tests/test_pjm_030_fineprint.py
      - tests/test_pjm_031_procedure_matrix.py
      - tests/test_pjm_032_cost_bands.py
      - tests/test_pjm_038_calendar_targets.py
      - tests/test_pjm_039_calendar_focus.py
      - tests/test_pjm_040_global_focus_visibility.py
      - tests/test_pjm_041_route_focus.py
      - tests/test_pjm_042_skip_link_route.py
      - tests/test_pjm_043_mobile_nav_readability.py
      - tests/test_pjm_044_home_location_note.py
      - tests/test_pjm_045_settlement.py
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Functional UI Chromium WebKit axe and PJM-011/012/013 regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "playwright==1.56.0"
      - run: python -m playwright install --with-deps chromium webkit
      - name: Install test-only axe-core
        run: npm install --no-save --no-package-lock --ignore-scripts axe-core@4.10.3
      - name: Release output and manual G3-only gate regression
        run: python tests/test_pjm_012_build.py
      - name: Offline LAN HTTPS access policy regression
        run: python tests/test_pjm_012_lan.py
      - name: PJM-013 home nav route history and service boundaries
        run: python tests/test_pjm_013_navigation.py
      - name: PJM-013 new navigation WCAG and keyboard
        run: python tests/test_pjm_013_accessibility.py
      - name: PJM-014 minimal functional UI, safety labels, responsive Chromium WebKit
        run: python tests/test_pjm_014_compact_ui.py
      - name: PJM-018 Korean typography and responsive Chromium WebKit
        run: python tests/test_pjm_018_typography.py
      - name: PJM-020 concise insurance coverage summary and UI Chromium WebKit
        run: python tests/test_pjm_019_insurance.py
      - name: PJM-021 source-backed pet care examples and inline benefits Chromium WebKit
        run: python tests/test_pjm_021_guides.py
      - name: PJM-022 DB 2610 official public benefit guide Chromium WebKit
        run: python tests/test_pjm_022_db_guides.py
      - name: PJM-023 expanded pet insurance catalog and condition matrix Chromium WebKit
        run: python tests/test_pjm_023_catalog.py
      - name: PJM-030 compact bottom fine print and insurance readability Chromium WebKit
        run: python tests/test_pjm_030_fineprint.py
      - name: PJM-031 all 52 care procedure details, surgery cost caveat and species safety Chromium WebKit
        run: python tests/test_pjm_031_procedure_matrix.py
      - name: PJM-032 broad cost bands, government medians and evidence-safe source footer Chromium WebKit
        run: python tests/test_pjm_032_cost_bands.py
      - name: PJM-016 map marker selected-card feedback Chromium WebKit
        run: python tests/test_pjm_016_marker_selection.py
      - name: PJM-012 Kakao mock responsive and GPS
        run: python tests/test_pjm_012.py
      - name: PJM-012 iPhone and iPad WebKit
        run: python tests/test_pjm_012_mobile.py
      - name: PJM-012 nearby axe WCAG regression
        run: python tests/test_pjm_012_accessibility.py
      - name: PJM-011 booking and insurance regression
        run: python tests/test_pjm_011.py
      - name: PJM-038 mobile booking week navigation targets Chromium WebKit
        run: python tests/test_pjm_038_calendar_targets.py
      - name: PJM-039 booking calendar keyboard focus Chromium WebKit
        run: python tests/test_pjm_039_calendar_focus.py
      - name: PJM-040 global keyboard focus Chromium WebKit
        run: python tests/test_pjm_040_global_focus_visibility.py
      - name: PJM-041 SPA route focus Chromium WebKit
        run: python tests/test_pjm_041_route_focus.py
      - name: PJM-042 skip link route and history preservation Chromium WebKit
        run: python tests/test_pjm_042_skip_link_route.py
      - name: PJM-043 mobile bottom navigation legibility Chromium WebKit
        run: python tests/test_pjm_043_mobile_nav_readability.py
      - name: PJM-044 concise home location disclosure Chromium WebKit
        run: python tests/test_pjm_044_home_location_note.py
      - name: PJM-045 G2 insurance payout and self-payment matrix Chromium WebKit
        run: python tests/test_pjm_045_settlement.py
      - name: REAL Kakao SDK, fixed nonpersonal Seoul coordinate (feature push only)
        if: github.event_name == 'push'
        env:
          PJM012_KAKAO_JS_KEY: ${{ secrets.PJM012_KAKAO_JS_KEY }}
        run: python tests/test_pjm_012_live.py
      - name: Mock-only browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjm-014-functional-ui-mock-qa
          path: qa-screenshots/
          if-no-files-found: ignore
